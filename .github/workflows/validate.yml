name: Validate skills
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref
      - name: Validate every skill
        run: |
          for dir in skills/*/; do
            agentskills validate "$dir"
          done
